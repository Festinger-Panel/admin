<div class="users-layout">
<aside class="users-submenu" aria-label="User management">
  <button class="active" data-user-section="users" type="button"><iconify-icon icon="hugeicons:users"></iconify-icon>Users</button>
  <button data-user-section="emails" type="button"><iconify-icon icon="hugeicons:mail-01"></iconify-icon>Emails</button>
</aside>
<section class="users-view" aria-labelledby="users-title">
  <div class="users-title-row"><span class="users-title-icon"><iconify-icon icon="hugeicons:users"></iconify-icon></span><h1 id="users-title">Users</h1><div class="users-toolbar"><button class="users-button" id="users-refresh" type="button"><iconify-icon icon="hugeicons:refresh-03"></iconify-icon>Refresh</button><button class="users-button primary" id="users-add" type="button"><iconify-icon icon="hugeicons:user-plus"></iconify-icon>Add User</button></div></div>
  <div class="users-controls"><div class="users-tabs"><button class="users-tab active" data-user-filter="all">ALL</button><button class="users-tab" data-user-filter="active">ACTIVE</button><button class="users-tab" data-user-filter="invited">INVITED</button><button class="users-tab" data-user-filter="requests">REQUESTS</button></div><div class="users-tools"><button class="users-circle" aria-label="More">•••</button><button class="users-circle" id="users-search-toggle" aria-label="Search"><iconify-icon icon="hugeicons:search-01"></iconify-icon></button><button class="users-circle" aria-label="Sort"><iconify-icon icon="hugeicons:sorting-01"></iconify-icon></button></div></div>
  <label class="users-inline-search" id="users-inline-search"><iconify-icon icon="hugeicons:search-01"></iconify-icon><input id="users-query" type="search" placeholder="Search users" /></label>
  <div class="selection-bar" id="users-selection-bar"><span><strong id="users-selected-count">0</strong> selected</span><button id="users-remove-access" type="button" disabled><iconify-icon icon="ci:block"></iconify-icon>Remove Access</button></div>
  <table class="users-table"><thead><tr><th class="users-check"><input type="checkbox" aria-label="Select all users" /></th><th>USER</th><th>EMAIL</th><th>ASSIGNMENTS</th><th>STATUS</th></tr></thead><tbody id="users-table-body"><tr data-user-status="active" data-owner="true"><td class="users-check"><input type="checkbox" aria-label="Select user" /></td><td><span class="users-person"><span class="users-avatar" id="managed-user-avatar">AD</span><span id="managed-user-name">Admin</span></span></td><td>Anonymous account</td><td><span class="users-pill">Main Event</span><span class="users-pill">Admin</span></td><td><span class="users-status">ACTIVE</span></td></tr></tbody></table>
  <div class="users-empty" id="users-empty">No users match this view.</div>
</section>
<section class="users-view email-view" id="email-view" aria-labelledby="emails-title" hidden>
  <div class="users-title-row"><span class="users-title-icon"><iconify-icon icon="hugeicons:mail-01"></iconify-icon></span><h1 id="emails-title">Emails</h1><div class="users-toolbar"><button class="users-button" id="emails-refresh" type="button"><iconify-icon icon="hugeicons:refresh-03"></iconify-icon>Refresh</button><button class="users-button" id="emails-copy" type="button"><iconify-icon icon="ci:copy"></iconify-icon>Copy Link</button><button class="users-button primary" id="emails-add" type="button"><iconify-icon icon="hugeicons:user-plus"></iconify-icon>Add Mail</button></div></div>
  <table class="users-table emails-table"><thead><tr><th>USER</th><th>EMAIL</th><th>USERNAME</th><th>PASSWORD</th><th class="email-delete-column">DELETE</th></tr></thead><tbody id="email-registrations"></tbody></table>
  <div class="emails-empty" id="emails-empty">No email registrations yet. Use Copy Link to share the form.</div>
</section>
</div>
<div class="add-user-overlay" id="add-user-overlay" aria-hidden="true">
  <section class="add-user-modal" role="dialog" aria-modal="true" aria-labelledby="add-user-title">
    <header><h2 id="add-user-title">Add User to Subfests</h2><button id="add-user-close" type="button" aria-label="Close"><iconify-icon icon="ci:close-md"></iconify-icon></button></header>
    <label class="add-user-field">Email <span>*</span><span class="email-selector"><span class="selected-invite-emails" id="selected-invite-emails"></span><input id="invite-email" type="search" autocomplete="off" placeholder="Search registered emails" /></span><span class="email-suggestions" id="email-suggestions"></span></label>
    <button class="add-fest-button" type="button">+ Add Fest</button>
    <label class="fest-search"><iconify-icon icon="hugeicons:search-01"></iconify-icon><input type="search" placeholder="Search fest or role" /></label>
    <div class="access-table"><div class="access-head"><span>FEST</span><span>ROLES</span></div><div class="access-row"><strong>Main Event</strong><div class="role-selection"><span class="selected-roles" id="selected-roles"></span><div class="role-picker"><button id="role-toggle" type="button" aria-expanded="false">+ Add role</button><div class="role-menu" id="role-menu"><button type="button" data-role="Team Manager">Team Manager</button><button type="button" data-role="Media">Media</button><button type="button" data-role="Volunteer">Volunteer</button><button type="button" data-role="Judge">Judge</button></div></div></div></div></div>
    <p class="add-user-error" id="add-user-error" role="status"></p>
    <footer><button class="users-button" id="add-user-cancel" type="button">Cancel</button><button class="users-button primary" id="add-access" type="button">Add Access</button></footer>
  </section>
</div>
