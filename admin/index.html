<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Page - Festinger 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Primary colours */
      --color-red: #D2202D;
      --color-yellow: #F0B81B;
      --color-green: #22AC5E;

      /* Secondary colours */
      --color-coral: #D9653D;
      --color-bright-green: #28AE62;
      --color-golden: #E9B449;

      /* Additional palette */
      --color-light-gold: #EAB750;
      --color-soft-green: #51B26C;
      --color-green-light: #53B26D;
      --color-dark-red: #C54A43;
      --color-deep-red: #BF2530;
      --color-mustard: #E2AF3F;
      --color-muted-red: #C64842;
      --color-brown-red: #B34333;
      --color-orange-red: #D9673F;
      --color-light-golden: #E6B550;
      --color-leaf-green: #33B061;
      --color-coral-red: #D03F42;
      --color-warm-gold: #E4B450;
      --color-muted-coral: #C64B44;

      /* Background */
      --color-background: transparent;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--color-background);
      color: var(--color-brown-red);
      padding: 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 330px;
      background: #ffffff;
      border: 1.5px solid var(--color-golden);
      border-radius: 18px;
      padding: 1.5rem 1.25rem;
      text-align: center;
      box-shadow: 0 10px 25px -8px rgba(179, 67, 51, 0.08);
      position: relative;
    }

    /* Icon */
    .icon-wrapper {
      width: 42px;
      height: 42px;
      margin: 0 auto 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--color-deep-red);
      line-height: 1.25;
      margin-bottom: 0.25rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.8125rem;
      color: var(--color-muted-red);
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    /* Passcode Boxes */
    .pin-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 0.85rem;
    }

    .pin-box {
      width: 46px;
      height: 52px;
      border: 1.5px solid var(--color-light-gold);
      border-radius: 10px;
      background: #ffffff;
      font-family: inherit;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--color-deep-red);
      text-align: center;
      outline: none;
      transition: all 0.15s ease;
      caret-color: var(--color-yellow);
      -webkit-appearance: none;
    }

    .pin-box:focus {
      border-color: var(--color-yellow);
      box-shadow: 0 0 0 2.5px rgba(240, 184, 27, 0.25);
      transform: translateY(-1px);
    }

    .pin-box.error {
      border-color: var(--color-red) !important;
      color: var(--color-red) !important;
      animation: shake 0.35s ease-in-out;
    }

    .pin-box.success {
      border-color: var(--color-green) !important;
      color: var(--color-green) !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    /* Message Alert */
    .status-msg {
      min-height: 18px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      transition: all 0.2s ease;
    }

    .status-msg.error {
      color: var(--color-red);
    }

    .status-msg.success {
      color: var(--color-green);
    }

    /* Unlocked Admin Content */
    #adminContent {
      display: none;
      animation: fadeIn 0.25s ease;
      padding: 0.25rem 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #ffffff;
      border: 1px solid var(--color-green);
      color: var(--color-green);
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .admin-welcome-text {
      font-size: 0.875rem;
      color: var(--color-brown-red);
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .lock-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      background: #ffffff;
      border: 1.5px solid var(--color-coral);
      color: var(--color-coral);
      border-radius: 10px;
      font-size: 0.8125rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lock-btn:hover {
      background: var(--color-coral);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Lock Screen Section -->
    <div id="lockScreen">
      <div class="icon-wrapper">
        <svg class="icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="23" fill="#F0B81B"/>
          <rect x="21.5" y="11" width="5" height="16" rx="2.5" fill="#FFFFFF"/>
          <circle cx="24" cy="34" r="2.75" fill="#FFFFFF"/>
        </svg>
      </div>

      <h1>Admin Page</h1>
      <p class="subtitle">Enter 3-digit passcode</p>

      <!-- 3 Passcode Boxes -->
      <form id="passcodeForm" onsubmit="return false;">
        <div class="pin-container">
          <input type="password" inputmode="numeric" maxlength="1" class="pin-box" id="pin1" autofocus autocomplete="off" />
          <input type="password" inputmode="numeric" maxlength="1" class="pin-box" id="pin2" autocomplete="off" />
          <input type="password" inputmode="numeric" maxlength="1" class="pin-box" id="pin3" autocomplete="off" />
        </div>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>

    <!-- Unlocked Admin Content Section -->
    <div id="adminContent">
      <div class="success-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Access Granted
      </div>

      <h1>Admin Page</h1>
      <p class="admin-welcome-text">
        Welcome to the Festinger 2.0 Admin Portal. Access unlocked successfully.
      </p>

      <button class="lock-btn" id="lockBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Lock
      </button>
    </div>

  </div>

  <script>
    const CORRECT_PASSCODE = "340";
    const pins = [
      document.getElementById('pin1'),
      document.getElementById('pin2'),
      document.getElementById('pin3')
    ];
    const statusMsg = document.getElementById('statusMsg');
    const lockScreen = document.getElementById('lockScreen');
    const adminContent = document.getElementById('adminContent');
    const lockBtn = document.getElementById('lockBtn');

    window.addEventListener('DOMContentLoaded', () => {
      pins[0].focus();
    });

    pins.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val[0] : '';
        clearErrors();

        if (val && idx < pins.length - 1) {
          pins[idx + 1].focus();
        }

        checkPasscode();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (!input.value && idx > 0) {
            pins[idx - 1].focus();
            pins[idx - 1].value = '';
          }
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          pins[idx - 1].focus();
        } else if (e.key === 'ArrowRight' && idx < pins.length - 1) {
          pins[idx + 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData || window.clipboardData).getData('text').trim();
        const digits = pasted.replace(/[^0-9]/g, '').slice(0, 3);
        digits.split('').forEach((d, i) => {
          if (pins[i]) pins[i].value = d;
        });
        if (digits.length > 0) {
          const nextIndex = Math.min(digits.length, pins.length - 1);
          pins[nextIndex].focus();
        }
        checkPasscode();
      });
    });

    function checkPasscode() {
      const entered = pins.map(p => p.value).join('');
      if (entered.length === 3) {
        if (entered === CORRECT_PASSCODE) {
          pins.forEach(p => {
            p.classList.remove('error');
            p.classList.add('success');
            p.blur();
          });
          statusMsg.textContent = "Verified!";
          statusMsg.className = "status-msg success";

          setTimeout(() => {
            lockScreen.style.display = 'none';
            adminContent.style.display = 'block';
          }, 350);
        } else {
          pins.forEach(p => {
            p.classList.remove('success');
            p.classList.add('error');
          });
          statusMsg.textContent = "Incorrect passcode";
          statusMsg.className = "status-msg error";

          setTimeout(() => {
            pins.forEach(p => {
              p.value = '';
              p.classList.remove('error');
            });
            pins[0].focus();
          }, 700);
        }
      }
    }

    function clearErrors() {
      pins.forEach(p => p.classList.remove('error'));
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";
    }

    lockBtn.addEventListener('click', () => {
      adminContent.style.display = 'none';
      lockScreen.style.display = 'block';
      pins.forEach(p => {
        p.value = '';
        p.classList.remove('success', 'error');
      });
      statusMsg.textContent = "";
      pins[0].focus();
    });
  </script>
</body>
</html>
