<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Festinger 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Primary colours */
      --color-red: #D2202D;
      --color-yellow: #F0B81B;
      --color-green: #22AC5E;

      /* Secondary colours */
      --color-coral: #D9653D;
      --color-bright-green: #28AE62;
      --color-golden: #E9B449;

      /* Additional palette */
      --color-light-gold: #EAB750;
      --color-soft-green: #51B26C;
      --color-green-light: #53B26D;
      --color-dark-red: #C54A43;
      --color-deep-red: #BF2530;
      --color-mustard: #E2AF3F;
      --color-muted-red: #C64842;
      --color-brown-red: #B34333;
      --color-orange-red: #D9673F;
      --color-light-golden: #E6B550;
      --color-leaf-green: #33B061;
      --color-coral-red: #D03F42;
      --color-warm-gold: #E4B450;
      --color-muted-coral: #C64B44;

      /* UI Specific */
      --input-bg: #FDF2F3;
      --input-placeholder: #9E8C8E;
      --card-border: #C54A43;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF;
      color: #111111;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .login-card {
      width: 100%;
      max-width: 760px;
      min-height: 420px;
      background: #FFFFFF;
      border: 1px solid var(--card-border);
      border-radius: 26px;
      display: flex;
      align-items: stretch;
      position: relative;
    }

    /* Left Decorative Arch Panel */
    .left-panel {
      width: 320px;
      flex-shrink: 0;
      margin: -1px 0 -1px -1px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .arch-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .arch-inner-img {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 84%;
      max-height: 76%;
      object-fit: contain;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    /* Right Form Content */
    .right-panel {
      flex: 1;
      padding: 42px 36px 38px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .welcome-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: #000000;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .welcome-subtitle {
      font-size: 0.85rem;
      font-weight: 400;
      color: #2B2B2B;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    /* 4 Diamonds Row */
    .diamonds-row {
      display: flex;
      align-items: center;
      gap: 1px;
      margin-bottom: 26px;
    }

    .diamonds-svg {
      width: 64px;
      height: 16px;
      display: block;
    }

    /* Form Controls */
    .login-form {
      display: flex;
      flex-direction: column;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-of-type {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1E1E1E;
      margin-bottom: 7px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input-bg);
      border: 1px solid transparent;
      border-radius: 8px;
      height: 40px;
      padding: 0 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--color-golden);
      box-shadow: 0 0 0 2px rgba(240, 184, 27, 0.18);
    }

    .input-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--input-placeholder);
      display: block;
    }

    .form-input {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 400;
      color: #1E1E1E;
    }

    .form-input::placeholder {
      color: var(--input-placeholder);
      opacity: 1;
    }

    .password-toggle-btn {
      background: none;
      border: none;
      padding: 2px;
      color: var(--input-placeholder);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s ease;
    }

    .password-toggle-btn:hover {
      color: var(--color-deep-red);
    }

    .password-toggle-btn svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .login-btn {
      width: 100%;
      height: 40px;
      background: var(--color-yellow);
      color: #111111;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .login-btn:hover {
      background: var(--color-golden);
    }

    .login-btn:active {
      transform: translateY(1px);
    }

    .input-wrapper.error {
      border-color: var(--color-red);
      animation: shake 0.3s ease-in-out;
    }

    .login-status {
      min-height: 18px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 10px;
      text-align: center;
      display: none;
    }

    .login-status.error {
      display: block;
      color: var(--color-red);
    }

    .login-status.success {
      display: block;
      color: var(--color-green);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* react-hot-toast style Toaster */
    .rht-toaster {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .rht-toast {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      color: #363636;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      padding: 9px 14px;
      border-radius: 999px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1), 0 3px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.05);
      max-width: 360px;
      animation: rhtEnter 0.28s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
    }

    .rht-toast.leaving {
      animation: rhtLeave 0.22s cubic-bezier(0.06, 0.71, 0.55, 1) forwards;
    }

    @keyframes rhtEnter {
      0% {
        transform: translate3d(0, -18px, 0) scale(0.88);
        opacity: 0;
      }
      100% {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 1;
      }
    }

    @keyframes rhtLeave {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate3d(0, -14px, 0) scale(0.9);
        opacity: 0;
      }
    }

    .rht-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      animation: rhtIconPop 0.24s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.06s both;
    }

    @keyframes rhtIconPop {
      from {
        transform: scale(0.4);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .rht-icon.success {
      background: var(--color-green);
      color: #FFFFFF;
    }

    .rht-icon.error {
      background: var(--color-red);
      color: #FFFFFF;
    }

    /* Responsive adjustments for mobile: place all contents inside the arch inner white area */
    @media (max-width: 640px) {
      body {
        background: var(--color-red);
        padding: 0.35rem;
      }

      .login-card {
        width: 100%;
        max-width: 100%;
        min-height: 550px;
        border: none;
        background: transparent;
        border-radius: 28px;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      .left-panel {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        z-index: 0;
      }

      .arch-inner-img {
        display: block;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        width: 165px;
        max-height: 145px;
      }

      .right-panel {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 162px 11.5% 42px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
      }

      .welcome-title {
        font-size: 1.65rem;
        margin-bottom: 5px;
        text-align: center;
      }

      .welcome-subtitle {
        font-size: 0.8rem;
        margin-bottom: 14px;
        text-align: center;
      }

      .diamonds-row {
        justify-content: center;
        margin-bottom: 18px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group:last-of-type {
        margin-bottom: 18px;
      }

      .input-wrapper {
        height: 42px;
      }

      .login-btn {
        height: 42px;
      }
    }

    @media (max-width: 360px) {
      .login-card {
        min-height: 510px;
      }

      .arch-inner-img {
        top: 24px;
        width: 145px;
        max-height: 130px;
      }

      .right-panel {
        padding: 144px 10.5% 36px;
      }

      .welcome-title {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>

  <main class="login-card">
    <!-- Left Arch Panel -->
    <div class="left-panel" aria-hidden="true">
      <svg class="arch-svg" viewBox="0 0 284 368" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
        <!-- Outer Red Rounded Frame -->
        <rect x="0" y="0" width="284" height="368" rx="23" fill="#D2202D" />
        <!-- Inner Yellow Rounded Frame (widened) -->
        <rect x="8" y="12" width="268" height="346" rx="15" fill="#F0B81B" />
        <!-- Inner White Stepped Arch Shape (widened) -->
        <path
          d="M 34 344
             H 250
             A 12 12 0 0 0 262 332
             V 84
             A 10 10 0 0 0 252 74
             H 226
             A 6 6 0 0 1 220.5 70.2
             A 84 84 0 0 0 63.5 70.2
             A 6 6 0 0 1 58 74
             H 32
             A 10 10 0 0 0 22 84
             V 332
             A 12 12 0 0 0 34 344
             Z"
          fill="#FFFFFF"
        />
      </svg>
      <img src="./Asett/Logo.png" alt="Make It Your Own" class="arch-inner-img" />
    </div>

    <!-- Right Sign-In Form -->
    <div class="right-panel">
      <h1 class="welcome-title">Welcome Back</h1>
      <p class="welcome-subtitle">Please enter your details to sign in.</p>

      <!-- 4 Alternating Red & Yellow Diamonds -->
      <div class="diamonds-row" aria-hidden="true">
        <svg class="diamonds-svg" viewBox="0 0 56 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="7,0.5 13.5,7 7,13.5 0.5,7" fill="#BF2530" />
          <polygon points="21,0.5 27.5,7 21,13.5 14.5,7" fill="#F0B81B" />
          <polygon points="35,0.5 41.5,7 35,13.5 28.5,7" fill="#BF2530" />
          <polygon points="49,0.5 55.5,7 49,13.5 42.5,7" fill="#F0B81B" />
        </svg>
      </div>

      <form class="login-form" id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="username">User Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="8" cy="5.25" r="2.5" stroke="currentColor" stroke-width="1.2" />
              <path d="M3.5 13.25C3.5 10.9 5.5 9.5 8 9.5C10.5 9.5 12.5 10.9 12.5 13.25" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            </svg>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Enter Your Username"
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3.25" y="7" width="9.5" height="6.75" rx="1.75" stroke="currentColor" stroke-width="1.2" />
              <path d="M5.25 7V5.25C5.25 3.73122 6.48122 2.5 8 2.5C9.51878 2.5 10.75 3.73122 10.75 5.25V7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
              <circle cx="8" cy="10.35" r="0.85" fill="currentColor" />
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter Your Password"
              autocomplete="current-password"
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="password-toggle-btn"
              aria-label="Show password"
              title="Show/Hide Password"
            >
              <!-- Eye Icon (Show) -->
              <svg id="eyeIconOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Eye-Off Icon (Hide) -->
              <svg id="eyeIconClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <div id="loginStatus" class="login-status" role="alert"></div>
        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>
  </main>

  <!-- react-hot-toast style Toaster Container -->
  <div class="rht-toaster" id="rhtToaster" aria-live="polite"></div>

  <!-- Firebase SDKs & Backend Config from https://api-festinger.vercel.app/ -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://api-festinger.vercel.app/config.js"></script>
  <script src="./firebase_sync.js"></script>
  <script>
    if (window.location.protocol !== "file:" && /\/index\.html$/i.test(window.location.pathname)) {
      window.history.replaceState(
        null,
        "",
        window.location.pathname.replace(/\/index\.html$/i, "/") + window.location.search + window.location.hash
      );
    }

    (async function () {
      let config = window.BACKEND_CONFIG;
      if (!config?.firebaseConfig?.apiKey && typeof window.loadBackendEnv === "function") {
        try {
          config = await window.loadBackendEnv("https://api-festinger.vercel.app/.env");
        } catch (_) {}
      }
      if (!config?.firebaseConfig?.apiKey) {
        for (let attempt = 0; attempt < 2; attempt++) {
          try {
            const res = await fetch("https://api-festinger.vercel.app/api/config");
            if (res.ok) {
              config = await res.json();
              break;
            }
          } catch (_) {
            await new Promise((r) => setTimeout(r, 400));
          }
        }
      }

      // Initialize Firebase with config from backend
      let db = null;
      try {
        if (typeof firebase !== "undefined" && config?.firebaseConfig) {
          if (!firebase.apps.length) {
            firebase.initializeApp(config.firebaseConfig);
          }
          db = firebase.firestore();

          // Ensure default admin credentials ("aslan" / "340") exist in Firebase Firestore
          const adminDocRef = db.collection("admins").doc("default");
          const snap = await adminDocRef.get();
          if (!snap.exists) {
            await adminDocRef.set({
              username: "aslan",
              password: "340",
              updatedAt: new Date().toISOString()
            });
          }
        }
      } catch (err) {
        console.warn("Firestore connection notice:", err.message);
      }

      const rhtToaster = document.getElementById("rhtToaster");
      function showToast(message, type = "success", duration = 2600) {
        if (!rhtToaster) return;
        const toastEl = document.createElement("div");
        toastEl.className = "rht-toast";
        const iconSvg =
          type === "error"
            ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
            : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

        toastEl.innerHTML = `
          <span class="rht-icon ${type === "error" ? "error" : "success"}">${iconSvg}</span>
          <span></span>
        `;
        toastEl.querySelector("span:last-child").textContent = message;
        rhtToaster.appendChild(toastEl);

        setTimeout(() => {
          toastEl.classList.add("leaving");
          toastEl.addEventListener("animationend", () => toastEl.remove(), { once: true });
        }, duration);
      }

      const loginForm = document.getElementById("loginForm");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const eyeIconOpen = document.getElementById("eyeIconOpen");
      const eyeIconClosed = document.getElementById("eyeIconClosed");
      const loginStatus = document.getElementById("loginStatus");
      const loginBtn = loginForm.querySelector(".login-btn");
      const inputWrappers = document.querySelectorAll(".input-wrapper");

      togglePasswordBtn.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        eyeIconOpen.style.display = isHidden ? "none" : "block";
        eyeIconClosed.style.display = isHidden ? "block" : "none";
        togglePasswordBtn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
      });

      function clearError() {
        loginStatus.className = "login-status";
        loginStatus.textContent = "";
        inputWrappers.forEach((w) => w.classList.remove("error"));
      }

      usernameInput.addEventListener("input", clearError);
      passwordInput.addEventListener("input", clearError);

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const enteredUser = usernameInput.value.trim();
        const enteredPass = passwordInput.value.trim();

        loginBtn.disabled = true;
        loginBtn.textContent = "Verifying...";

        let isValid = false;

        try {
          if (db) {
            // Verify credentials against Firebase Firestore ("admins" collection)
            const docSnap = await db.collection("admins").doc("default").get();
            if (docSnap.exists) {
              const data = docSnap.data();
              if (
                String(data.username || "").toLowerCase() === enteredUser.toLowerCase() &&
                String(data.password || "") === enteredPass
              ) {
                isValid = true;
              }
            } else {
              // Query collection in case admin document has a custom ID
              const querySnap = await db
                .collection("admins")
                .where("username", "==", enteredUser.toLowerCase())
                .where("password", "==", enteredPass)
                .limit(1)
                .get();
              isValid = !querySnap.empty;
            }
          } else {
            const localCreds = JSON.parse(localStorage.getItem("festinger_admin_creds") || "null");
            const expectedUser = (localCreds?.username || "aslan").toLowerCase();
            const expectedPass = String(localCreds?.password || "340");
            isValid = enteredUser.toLowerCase() === expectedUser && enteredPass === expectedPass;
          }
        } catch (err) {
          console.warn("Firebase verification fallback:", err.message);
          const localCreds = JSON.parse(localStorage.getItem("festinger_admin_creds") || "null");
          const expectedUser = (localCreds?.username || "aslan").toLowerCase();
          const expectedPass = String(localCreds?.password || "340");
          isValid = enteredUser.toLowerCase() === expectedUser && enteredPass === expectedPass;
        } finally {
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        }

        if (isValid) {
          sessionStorage.setItem("festinger_admin_auth", "true");
          sessionStorage.setItem("festinger_user_access_mode", "full");
          sessionStorage.setItem("festinger_admin_user", enteredUser);
          sessionStorage.setItem("festinger_backend_config", JSON.stringify(config));

          showToast("Verified via Firebase! Redirecting...", "success");

          setTimeout(() => {
            window.location.href = "./dashboard.html";
          }, 450);
          return;
        }

        // Load Users, Roles & Duties directly from Firebase Firestore ("festinger_data")
        let usersList = [];
        let rolesDefs = [];
        let dutiesList = [];
        if (window.FestingerDB) {
          try {
            const fbData = await window.FestingerDB.loadAll();
            usersList = Array.isArray(fbData.owners) ? fbData.owners : [];
            rolesDefs = Array.isArray(fbData.roles) ? fbData.roles : [];
            dutiesList = Array.isArray(fbData.duties) ? fbData.duties : [];
          } catch (_) {}
        }

        // Check registered Users from Firebase Firestore
        let matchedUser = null;
        if (Array.isArray(usersList)) {
          matchedUser = usersList.find((u) => {
            const uName = String(u.name || "").trim().toLowerCase();
            const uEmail = String(u.email || "").trim().toLowerCase();
            const uPass = String(u.password || "").trim();
            const inputLower = enteredUser.toLowerCase();
            return (inputLower === uName || inputLower === uEmail) && enteredPass === uPass;
          });
        }

        if (matchedUser) {
          sessionStorage.setItem("festinger_user_auth", "true");
          sessionStorage.setItem("festinger_logged_user", JSON.stringify(matchedUser));

          // Check Owner Page permissions (Read -> Festival Dashboard only; Read + Write -> Full Owner Page)
          let hasRead = false;
          let hasWrite = false;
          const isActiveUser = String(matchedUser.status || "").toUpperCase() === "ACTIVE";

          if (isActiveUser) {
            const assignedRoleNames = new Set();
            if (matchedUser.role) assignedRoleNames.add(String(matchedUser.role).toLowerCase());

            if (Array.isArray(dutiesList)) {
              dutiesList.forEach((d) => {
                const sameUser =
                  (d.userId && d.userId === matchedUser.id) ||
                  (d.userEmail && String(d.userEmail).toLowerCase() === String(matchedUser.email || "").toLowerCase());
                if (sameUser && Array.isArray(d.roles)) {
                  d.roles.forEach((rn) => assignedRoleNames.add(String(rn).toLowerCase()));
                }
              });
            }

            if (Array.isArray(rolesDefs)) {
              rolesDefs.forEach((r) => {
                if (assignedRoleNames.has(String(r.name || "").toLowerCase()) && Array.isArray(r.permissions)) {
                  if (r.permissions.includes("entry:read")) hasRead = true;
                  if (r.permissions.includes("entry:write")) hasWrite = true;
                }
              });
            }
          }

          if (isActiveUser && hasRead && hasWrite) {
            sessionStorage.setItem("festinger_admin_auth", "true");
            sessionStorage.setItem("festinger_user_access_mode", "full");
            sessionStorage.setItem("festinger_admin_user", matchedUser.name || matchedUser.email);
            showToast(`Welcome, ${matchedUser.name}! Full Owner Page access granted.`, "success");
            setTimeout(() => {
              window.location.href = "./dashboard.html";
            }, 450);
          } else if (isActiveUser && hasRead) {
            let assignedFestName = "";
            if (Array.isArray(dutiesList)) {
              const userDuty = dutiesList.find(
                (d) =>
                  (d.userId && d.userId === matchedUser.id) ||
                  (d.userEmail && String(d.userEmail).toLowerCase() === String(matchedUser.email || "").toLowerCase())
              );
              if (userDuty && userDuty.festName) {
                assignedFestName = userDuty.festName;
              }
            }

            sessionStorage.setItem("festinger_user_access_mode", "festival_only");
            sessionStorage.setItem("festinger_assigned_fest_name", assignedFestName);
            sessionStorage.removeItem("festinger_admin_auth");
            showToast(`Welcome, ${matchedUser.name}! Opening Festival Dashboard.`, "success");
            setTimeout(() => {
              window.location.href = "./setup_fest.html";
            }, 450);
          } else {
            showToast(`Welcome, ${matchedUser.name}! Redirecting...`, "success");
            setTimeout(() => {
              window.location.href = "./user_welcome.html";
            }, 450);
          }
        } else {
          showToast("Invalid username or password.", "error");
          inputWrappers.forEach((w) => {
            w.classList.remove("error");
            void w.offsetWidth;
            w.classList.add("error");
          });
        }
      });
    })();
  </script>
</body>
</html>
