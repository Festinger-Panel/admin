<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Festie account login" />
  <title>Festie Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="Asett/favicon.png" />
  <script>
    (() => { const mode = localStorage.getItem('festieTheme') || 'system'; const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; document.documentElement.style.setProperty('--accent', localStorage.getItem('festieAccent') || '#fa5458'); })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { festie: '#ef2633' },
          boxShadow: { card: '0 12px 30px rgba(17, 24, 39, 0.06)' }
        }
      }
    };
  </script>
  <style>
    html { background: #fcfbf9; }
    body { font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page-glow {
      background:
        radial-gradient(circle at 8% 54%, rgba(246, 237, 218, .35), transparent 18rem),
        radial-gradient(circle at 95% 84%, rgba(246, 237, 218, .26), transparent 20rem),
        #fcfbf9;
    }
    .field-icon { pointer-events: none; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px white inset !important; }
    .spinner { border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #submit-button { background: var(--accent); }
    #submit-button:hover { filter: brightness(.9); }
    #forgot-password { color: var(--accent); }
    #email:focus, #password:focus { border-color: var(--accent); --tw-ring-color: color-mix(in srgb, var(--accent) 22%, transparent); }
    html[data-theme="dark"] { color-scheme: dark; background: #111216; }
    html[data-theme="dark"] body,
    html[data-theme="dark"] main { background: #111216; color: #f5f5f6; }
    html[data-theme="dark"] section[aria-labelledby="auth-title"] { background: #1d1f24; border-color: #383a40; }
    html[data-theme="dark"] input { background: #27292f; border-color: #3b3e45; color: #f5f5f6; }
    html[data-theme="dark"] input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #27292f inset !important; -webkit-text-fill-color: #f5f5f6; }
  </style>
</head>
<body class="page-glow min-h-screen text-neutral-900 antialiased">
  <main class="min-h-screen border-t border-neutral-200 px-4 py-8 flex items-center justify-center">
    <section aria-labelledby="auth-title" class="grid w-full max-w-[920px] overflow-hidden rounded-[21px] border border-[#dedfe2] bg-white shadow-card md:grid-cols-[minmax(350px,42%)_1fr]">
      <div class="px-[30px] py-9 sm:px-10 md:order-2 md:flex md:flex-col md:justify-center md:py-12">
      <h1 id="auth-title" class="mb-[26px] text-center text-[23px] font-bold tracking-[-.03em]">Welcome Back</h1>

      <form id="auth-form" novalidate>
        <div class="mb-[11px]">
          <label for="email" class="mb-1 block text-[12px] font-medium">Username</label>
          <div class="relative">
            <svg class="field-icon absolute left-[11px] top-1/2 -translate-y-1/2 text-neutral-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="email" name="email" type="text" autocomplete="username" placeholder="Enter your username" required class="h-[38px] w-full rounded-[13px] border border-[#dadce0] bg-white pl-8 pr-3 text-[13px] outline-none transition placeholder:text-neutral-400 focus:border-[#ef2633] focus:ring-2 focus:ring-red-100" />
          </div>
        </div>

        <div>
          <label for="password" class="mb-1 block text-[12px] font-medium">Password</label>
          <div class="relative">
            <svg class="field-icon absolute left-[11px] top-1/2 -translate-y-1/2 text-neutral-600" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="5" required class="h-[36px] w-full rounded-[13px] border border-[#dadce0] bg-white pl-8 pr-10 text-[13px] outline-none transition placeholder:text-neutral-400 focus:border-[#ef2633] focus:ring-2 focus:ring-red-100" />
            <button id="toggle-password" type="button" aria-label="Show password" class="absolute right-[10px] top-1/2 -translate-y-1/2 rounded p-1 text-neutral-700 focus:outline-none">
              <svg id="eye-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </div>

        <div class="mt-[13px] flex justify-end">
          <button id="forgot-password" type="button" class="text-[11px] font-medium text-[#ef2633] hover:text-[#cf1420] hover:underline focus:outline-none focus:ring-2 focus:ring-[#ef2633]">Forgot password?</button>
        </div>

        <p id="message" role="status" aria-live="polite" class="mt-2 hidden rounded-lg px-3 py-2 text-[12px]"></p>

        <button id="submit-button" type="submit" class="mt-[19px] flex h-[36px] w-full items-center justify-center rounded-[12px] bg-[#ef2633] text-[13px] font-semibold text-white shadow-sm transition hover:bg-[#d91d29] focus:outline-none focus:ring-2 focus:ring-[#ef2633] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70">
          <span id="submit-label">Log In</span>
          <span id="submit-spinner" class="spinner ml-2 hidden h-4 w-4 rounded-full" aria-hidden="true"></span>
        </button>
      </form>
      </div>
      <div class="relative hidden min-h-[500px] bg-[#ffd420] md:order-1 md:block">
        <img src="Asett/login.png" alt="Secure login illustration" class="absolute inset-0 h-full w-full object-cover" />
      </div>
    </section>
  </main>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyCxbG-k87afwF687taz-TupzSkxI4_9p2g",
      authDomain: "festinger-panel.firebaseapp.com",
      projectId: "festinger-panel",
      storageBucket: "festinger-panel.firebasestorage.app",
      messagingSenderId: "375631831919",
      appId: "1:375631831919:web:e40c8c00dbe07f18bebe9a",
      measurementId: "G-L4BQZEL1MK"
    };

    const cloudinaryConfig = {
      cloudName: "da6fjyirm",
      uploadPreset: "festinger"
    };

    const form = document.querySelector('#auth-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const title = document.querySelector('#auth-title');
    const submitButton = document.querySelector('#submit-button');
    const submitLabel = document.querySelector('#submit-label');
    const spinner = document.querySelector('#submit-spinner');
    const forgotButton = document.querySelector('#forgot-password');
    const togglePassword = document.querySelector('#toggle-password');
    const eyeIcon = document.querySelector('#eye-icon');
    const message = document.querySelector('#message');
    let firebase = null;

    async function getFirebase() {
      if (firebase) return firebase;
      const [{ initializeApp }, authModule, firestoreModule] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
        import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
      ]);
      const app = initializeApp(firebaseConfig);
      firebase = { auth: authModule.getAuth(app), db: firestoreModule.getFirestore(app), ...authModule, ...firestoreModule };
      return firebase;
    }

    function bytesToBase64(bytes) {
      return btoa(String.fromCharCode(...bytes));
    }

    async function passwordHash(password, saltBase64) {
      const salt = Uint8Array.from(atob(saltBase64), (character) => character.charCodeAt(0));
      const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 210000 }, key, 256);
      return bytesToBase64(new Uint8Array(bits));
    }

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.className = `mt-2 rounded-lg px-3 py-2 text-[12px] ${type === 'success' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}`;
    }

    function clearMessage() {
      message.textContent = '';
      message.className = 'mt-2 hidden rounded-lg px-3 py-2 text-[12px]';
    }

    function friendlyError(error) {
      const messages = {
        'auth/operation-not-allowed': 'Anonymous authentication is disabled. Enable Authentication → Sign-in method → Anonymous in Firebase Console.',
        'auth/invalid-credential': 'The email or password is incorrect.',
        'auth/email-already-in-use': 'An account already exists for this email.',
        'auth/invalid-email': 'Enter a valid email address.',
        'auth/weak-password': 'Use a password with at least 6 characters.',
        'auth/popup-closed-by-user': 'Google sign-in was cancelled.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.'
      };
      return messages[error.code] || error.message || 'Something went wrong. Please try again.';
    }

    function setLoading(loading) {
      submitButton.disabled = loading;
      spinner.classList.toggle('hidden', !loading);
    }

    togglePassword.addEventListener('click', () => {
      const visible = passwordInput.type === 'text';
      passwordInput.type = visible ? 'password' : 'text';
      togglePassword.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
      eyeIcon.innerHTML = visible
        ? '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>'
        : '<path d="M3 3l18 18M10.6 6.2A11.5 11.5 0 0 1 12 6c6.5 0 10 6 10 6a16.2 16.2 0 0 1-2.1 2.8M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6a10.8 10.8 0 0 0 4.1-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessage();
      if (!form.reportValidity()) return;
      setLoading(true);
      try {
        const fb = await getFirebase();
        if (!fb.auth.currentUser) await fb.signInAnonymously(fb.auth);
        const credentialsRef = fb.doc(fb.db, 'appConfig', 'auth');
        let credentialsSnapshot = await fb.getDoc(credentialsRef);
        let credentials = credentialsSnapshot.exists() ? credentialsSnapshot.data() : null;
        const submittedUsername = emailInput.value.trim().toLowerCase();
        if (!credentials && submittedUsername === 'admin' && passwordInput.value === '81119') {
          const salt = bytesToBase64(crypto.getRandomValues(new Uint8Array(16)));
          credentials = { username: 'admin', salt, passwordHash: await passwordHash('81119', salt) };
          await fb.setDoc(credentialsRef, { ...credentials, createdAt: fb.serverTimestamp(), updatedAt: fb.serverTimestamp() });
        }
        let account = null;
        if (credentials?.salt && submittedUsername === String(credentials.username).toLowerCase()) {
          const submittedHash = await passwordHash(passwordInput.value, credentials.salt);
          if (submittedHash === credentials.passwordHash) account = { username:credentials.username, name:credentials.username, role:'admin' };
        }
        if (!account) {
          const registrations = fb.collection(fb.db, 'appConfig', 'auth', 'emailRegistrations');
          const registrationResult = await fb.getDocs(fb.query(registrations, fb.where('username', '==', submittedUsername), fb.limit(1)));
          const registrationDoc = registrationResult.docs[0];
          const registration = registrationDoc?.data();
          if (!registration || registration.password !== passwordInput.value) throw new Error('The username or password is incorrect.');
          const accessSnapshot = await fb.getDoc(fb.doc(fb.db, 'appConfig', 'auth', 'assignedUsers', registrationDoc.id));
          if (!accessSnapshot.exists() || accessSnapshot.data().status !== 'active') throw new Error('Access has not been granted for this account.');
          const access = accessSnapshot.data();
          account = { username:registration.username, name:registration.name || registration.username, role:'user', landingPage:'dashboard.html' };
        }
        account.landingPage ||= 'dashboard.html';
        localStorage.setItem('festieWebsiteAuthenticated', 'true');
        localStorage.setItem('festieDisplayName', account.name);
        localStorage.setItem('festieAccountUsername', account.username);
        localStorage.setItem('festieAccountRole', account.role);
        localStorage.setItem('festieLandingPage', account.landingPage);
        sessionStorage.setItem('festieAccountUsername', account.username);
        sessionStorage.setItem('festieAccountRole', account.role);
        sessionStorage.setItem('festieCurrentPassword', passwordInput.value);
        showMessage('You are now logged in. Opening your dashboard…', 'success');
        setTimeout(() => window.location.replace(account.landingPage), 350);
      } catch (error) {
        showMessage(friendlyError(error));
      } finally {
        setLoading(false);
      }
    });

    forgotButton.addEventListener('click', () => {
      showMessage('Password reset by email is unavailable for this anonymous Firebase setup. Change it from Dashboard → Security while signed in.');
    });

    if (
      localStorage.getItem('festieWebsiteAuthenticated') === 'true' ||
      sessionStorage.getItem('festieWebsiteAuthenticated') === 'true'
    ) {
      localStorage.setItem('festieWebsiteAuthenticated', 'true');
      localStorage.setItem('festieLandingPage', 'dashboard.html');
      localStorage.removeItem('festieMediaFiles');
      window.location.replace('dashboard.html');
    }
  </script>
</body>
</html>
