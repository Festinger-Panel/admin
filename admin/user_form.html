<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration Form - Festinger 2.0</title>
  <link rel="icon" type="image/png" href="./Asett/Logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Primary colours */
      --color-red: #D2202D;
      --color-yellow: #F0B81B;
      --color-green: #22AC5E;

      /* Secondary colours */
      --color-coral: #D9653D;
      --color-bright-green: #28AE62;
      --color-golden: #E9B449;

      /* Additional palette */
      --color-light-gold: #EAB750;
      --color-soft-green: #51B26C;
      --color-green-light: #53B26D;
      --color-dark-red: #C54A43;
      --color-deep-red: #BF2530;
      --color-mustard: #E2AF3F;
      --color-muted-red: #C64842;
      --color-brown-red: #B34333;
      --color-orange-red: #D9673F;
      --color-light-golden: #E6B550;
      --color-leaf-green: #33B061;
      --color-coral-red: #D03F42;
      --color-warm-gold: #E4B450;
      --color-muted-coral: #C64B44;

      /* UI Specific */
      --input-bg: #FDF2F3;
      --input-placeholder: #9E8C8E;
      --card-border: #C54A43;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF;
      color: #111111;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .form-card {
      width: 100%;
      max-width: 420px;
      background: #FFFFFF;
      border: 1.5px solid var(--card-border);
      border-radius: 22px;
      padding: 2rem 1.75rem;
      box-shadow: 0 16px 40px rgba(191, 37, 48, 0.08);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.1rem;
    }

    .brand-header img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .brand-header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #111111;
      line-height: 1.2;
    }

    .brand-header p {
      font-size: 0.74rem;
      color: var(--color-deep-red);
      font-weight: 600;
    }

    .diamonds-svg {
      width: 54px;
      height: 14px;
      display: block;
      margin-bottom: 1.25rem;
    }

    .user-reg-form {
      display: flex;
      flex-direction: column;
      gap: 0.95rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1E1E1E;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--input-bg);
      border: 1px solid transparent;
      border-radius: 9px;
      height: 40px;
      padding: 0 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .input-wrap:focus-within {
      background: #FFFFFF;
      border-color: var(--color-golden);
      box-shadow: 0 0 0 2px rgba(240, 184, 27, 0.2);
    }

    .form-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      color: #111111;
    }

    .form-input::placeholder {
      color: var(--input-placeholder);
    }

    .eye-btn {
      background: none;
      border: none;
      color: var(--input-placeholder);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .eye-btn:hover {
      color: var(--color-deep-red);
    }

    .submit-btn {
      margin-top: 6px;
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 9px;
      background: var(--color-yellow);
      color: #111111;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 800;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .submit-btn:hover {
      background: var(--color-golden);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    /* Submitted Confirmation View */
    .submitted-view {
      display: none;
      text-align: center;
      padding: 1.25rem 0.5rem;
    }

    .submitted-view.active {
      display: block;
    }

    .submitted-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--input-bg);
      color: var(--color-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .submitted-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--color-green);
      margin-bottom: 6px;
    }

    .submitted-desc {
      font-size: 0.84rem;
      color: #1E1E1E;
      line-height: 1.5;
    }

    /* react-hot-toast style Toaster */
    .rht-toaster {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .rht-toast {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      color: #111111;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
      padding: 9px 14px;
      border-radius: 999px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1), 0 3px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(197, 74, 67, 0.15);
      max-width: 360px;
      animation: rhtEnter 0.28s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
    }

    .rht-toast.leaving {
      animation: rhtLeave 0.22s cubic-bezier(0.06, 0.71, 0.55, 1) forwards;
    }

    @keyframes rhtEnter {
      0% { transform: translate3d(0, -18px, 0) scale(0.88); opacity: 0; }
      100% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
    }

    @keyframes rhtLeave {
      0% { transform: translate3d(0, 0, 0) scale(1); opacity: 1; }
      100% { transform: translate3d(0, -14px, 0) scale(0.9); opacity: 0; }
    }

    .rht-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #FFFFFF;
    }

    .rht-icon.success { background: var(--color-green); }
    .rht-icon.error { background: var(--color-red); }
  </style>
</head>
<body>

  <main class="form-card">
    <div id="formContainerView">
      <div class="brand-header">
        <img src="./Asett/Logo.png" alt="Festinger 2.0" />
        <div>
          <h1>Festinger 2.0</h1>
          <p>User Registration Form</p>
        </div>
      </div>

      <svg class="diamonds-svg" viewBox="0 0 56 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="7,0.5 13.5,7 7,13.5 0.5,7" fill="#BF2530" />
        <polygon points="21,0.5 27.5,7 21,13.5 14.5,7" fill="#F0B81B" />
        <polygon points="35,0.5 41.5,7 35,13.5 28.5,7" fill="#BF2530" />
        <polygon points="49,0.5 55.5,7 49,13.5 42.5,7" fill="#F0B81B" />
      </svg>

      <form class="user-reg-form" id="userRegForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="formUserName">Name</label>
          <div class="input-wrap">
            <input type="text" id="formUserName" class="form-input" placeholder="Enter your name" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="formUserEmail">Mail</label>
          <div class="input-wrap">
            <input type="email" id="formUserEmail" class="form-input" placeholder="Enter your email" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="formUserPass">Password</label>
          <div class="input-wrap">
            <input type="password" id="formUserPass" class="form-input" placeholder="Enter password" required />
            <button type="button" class="eye-btn" data-toggle-target="formUserPass" aria-label="Toggle password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="formUserRePass">Re-enter Password</label>
          <div class="input-wrap">
            <input type="password" id="formUserRePass" class="form-input" placeholder="Re-enter password" required />
            <button type="button" class="eye-btn" data-toggle-target="formUserRePass" aria-label="Toggle password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="formSubmitBtn">Submit</button>
      </form>
    </div>

    <!-- Submitted Confirmation State -->
    <div id="submittedView" class="submitted-view">
      <div class="submitted-badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <h2 class="submitted-title">Submitted</h2>
      <p class="submitted-desc">Your account details have been submitted successfully.</p>
    </div>
  </main>

  <div class="rht-toaster" id="rhtToaster" aria-live="polite"></div>

  <script>
    (function () {
      const rhtToaster = document.getElementById("rhtToaster");
      function showToast(message, type = "success", duration = 2600) {
        const toastEl = document.createElement("div");
        toastEl.className = "rht-toast";
        const iconSvg =
          type === "error"
            ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
            : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

        toastEl.innerHTML = `<span class="rht-icon ${type === "error" ? "error" : "success"}">${iconSvg}</span><span></span>`;
        toastEl.querySelector("span:last-child").textContent = message;
        rhtToaster.appendChild(toastEl);

        setTimeout(() => {
          toastEl.classList.add("leaving");
          toastEl.addEventListener("animationend", () => toastEl.remove(), { once: true });
        }, duration);
      }

      document.querySelectorAll("[data-toggle-target]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const input = document.getElementById(btn.getAttribute("data-toggle-target"));
          if (input) {
            input.type = input.type === "password" ? "text" : "password";
          }
        });
      });

      const userRegForm = document.getElementById("userRegForm");
      const formContainerView = document.getElementById("formContainerView");
      const submittedView = document.getElementById("submittedView");

      userRegForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("formUserName").value.trim();
        const email = document.getElementById("formUserEmail").value.trim();
        const pass = document.getElementById("formUserPass").value;
        const rePass = document.getElementById("formUserRePass").value;

        if (!name || !email || !pass || !rePass) {
          showToast("Please fill in all fields.", "error");
          return;
        }
        if (pass !== rePass) {
          showToast("Passwords do not match.", "error");
          return;
        }

        const newUser = {
          id: "user-" + Date.now(),
          name,
          email,
          role: "User",
          password: pass,
          type: "USER",
          grantedByName: "Self Registered",
          grantedByEmail: email,
          status: "REQUESTS"
        };

        if (window.FestingerDB) {
          try {
            const existing = await window.FestingerDB.loadDoc("owners");
            const list = Array.isArray(existing) ? existing : [];
            list.push(newUser);
            await window.FestingerDB.saveDoc("owners", list);
          } catch (_) {}
        }

        showToast("Submitted!", "success");
        formContainerView.style.display = "none";
        submittedView.classList.add("active");
      });
    })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://api-festinger.vercel.app/config.js"></script>
  <script src="./firebase_sync.js"></script>
</body>
</html>
